<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kulya the War Dog mark: a small dog with tall ears, a stitched scar on her brow, on a brass coin">
  <defs>
    <path id="arcTop" d="M256 256 m-196 0 a196 196 0 1 1 392 0"/>
    <path id="arcBot" d="M256 256 m-196 0 a196 196 0 1 0 392 0"/>
    <radialGradient id="disc" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c070"/>
      <stop offset=".5" stop-color="#c8a24f"/>
      <stop offset="1" stop-color="#9c7a30"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="252" fill="url(#brass)"/>
  <circle cx="256" cy="256" r="236" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#c8a24f" stroke-width="1.5" stroke-dasharray="3 6" opacity=".7"/>
  <!-- ears -->
  <g transform="translate(256 256) scale(.78) translate(-256 -256)"><path d="M176 262 L112 78 Q110 60 128 66 L238 196 Z" fill="#c8a24f"/>
  <path d="M336 262 L400 78 Q402 60 384 66 L274 196 Z" fill="#c8a24f"/>
  <path d="M184 250 L132 96 L228 206 Z" fill="#0b0d12" opacity=".55"/>
  <path d="M328 250 L380 96 L284 206 Z" fill="#0b0d12" opacity=".55"/>
  <!-- head -->
  <ellipse cx="256" cy="262" rx="100" ry="90" fill="#c8a24f"/>
  <ellipse cx="256" cy="312" rx="62" ry="50" fill="#c8a24f"/>
  <!-- eyes -->
  <circle cx="220" cy="256" r="12" fill="#0b0d12"/>
  <circle cx="292" cy="256" r="12" fill="#0b0d12"/>
  <circle cx="224" cy="252" r="3.5" fill="#e2c070"/>
  <circle cx="296" cy="252" r="3.5" fill="#e2c070"/>
  <!-- nose and mouth -->
  <ellipse cx="256" cy="322" rx="17" ry="13" fill="#0b0d12"/>
  <path d="M256 334 v12 M240 350 q16 12 32 0" fill="none" stroke="#0b0d12" stroke-width="5" stroke-linecap="round"/>
  <!-- the stitched scar on her brow -->
  <path d="M232 206 L288 194" fill="none" stroke="#0b0d12" stroke-width="4" stroke-linecap="round"/>
  <path d="M244 196 l-4 16 M258 193 l-4 16 M272 190 l-4 16" fill="none" stroke="#0b0d12" stroke-width="3.5" stroke-linecap="round"/></g>
  <!-- ring text -->
  <text font-family="Oswald, 'Arial Narrow', Impact, sans-serif" font-size="30" font-weight="600" letter-spacing="7" fill="#c8a24f">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">KULYA · THE WAR DOG</textPath>
  </text>
  <text font-family="Oswald, 'Arial Narrow', Impact, sans-serif" font-size="30" font-weight="600" letter-spacing="7" fill="#c8a24f">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">КУЛЯ · KHARKIV · 2022</textPath>
  </text>
</svg>
